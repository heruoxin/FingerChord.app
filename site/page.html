<!doctype html>
<html lang="$locale">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6155f5">
  <title>$title</title>
  <link rel="icon" href="${base}assets/icon.png">
  <link rel="apple-touch-icon" href="${base}assets/icon.png">
  <link rel="stylesheet" href="${base}style.css">
  $seoMetadata
  <script src="${base}site.js" defer></script>
</head>
<body id="top">
<a class="skip" href="#main">$skip</a>
<header class="masthead">
  <div class="wrap header-inner">
    <a class="brand" href="#top" aria-label="$home"><img src="${base}assets/icon.png" width="26" height="26" alt=""><span>$brand</span></a>
    <nav class="header-actions" aria-label="$brand">
      <a class="header-download" href="$downloadURL" hidden>$download</a>
      <details class="language-picker">
        <summary><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span>$currentLanguage</span><svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></summary>
        <div class="language-menu">$languageLinks</div>
      </details>
    </nav>
  </div>
</header>
<main id="main">
  <section class="hero" data-tone="244,89,65" aria-labelledby="hero-title">
    <div class="hero-grid wrap">
      <div class="hero-copy">
        <h1 id="hero-title">$headline</h1>
        <p class="intro">$intro</p>
        $downloadButton
      </div>
      <div class="icon-stage" aria-hidden="true">
        <svg class="icon-orbits" viewBox="0 0 600 600" fill="none"><ellipse cx="300" cy="300" rx="292" ry="202" transform="rotate(-32 300 300)"/><path d="M99 466C-5 359 28 150 209 73S576 112 583 265"/><circle cx="209" cy="73" r="4"/><circle cx="536" cy="437" r="3"/></svg>
        <div class="icon-exit"><div class="icon-tile">
          <img class="pad-arrive" src="${base}assets/hero-pad.svg" width="1024" height="1024" alt="">
          <img class="arc-tap" src="${base}assets/hero-arc.svg" width="1024" height="1024" alt="" style="transform-origin: $arcOrigin">
          <img class="hand-arrive" src="${base}assets/hero-hand.svg" width="1024" height="1024" alt="">
        </div></div>
      </div>
    </div>
  </section>
$gestureSections
  <section class="feature quiet" data-tone="244,45,98" id="quiet" aria-labelledby="quiet-title">
    <div class="feature-grid wrap">
      <div class="section-copy"><h2 id="quiet-title">$quietTitle</h2><p class="section-intro">$quietBody</p></div>
      <figure class="feature-art"><img class="settings-shot" src="${base}assets/settings-$locale.png" width="460" height="561" alt="$screenshotAlt"></figure>
    </div>
  </section>
  <section class="help-section" data-tone="244,0,100" id="help" aria-labelledby="help-title">
    <div class="help-grid wrap">
      <h2 id="help-title">$helpTitle</h2>
      <div class="help-items">$helpItems</div>
    </div>
  </section>
  <section class="closing" data-tone="244,89,65" id="download" aria-labelledby="closing-title">
    <div class="wrap closing-inner">
      <div class="closing-orbit" aria-hidden="true"></div>
      <img class="closing-icon" src="${base}assets/icon.png" width="96" height="96" alt="">
      <h2 id="closing-title">$closingTitle</h2>
      $downloadButton
    </div>
  </section>
</main>
<footer class="footer">
  <div class="wrap footer-inner"><span>© 2026 Ruoxin He · GPLv3</span><nav><a href="$repoURL">GitHub</a><a href="$changelogURL">$changelog</a></nav></div>
</footer>
</body>
</html>
